    <script>

        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .transition-theme { transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        const PROFILE_DATA = {

            socials: {

            projects: [

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [formStatus, setFormStatus] = useState(null); // 'sending', 'success', 'error'
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleDarkMode = () => {
                const newMode = !darkMode;
                setDarkMode(newMode);
                if (newMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setFormStatus('sending');

                try {
                    // Envio real via Fetch para o Formspree
                    const response = await fetch(`https://formspree.io/f/${PROFILE_DATA.formspreeId}`, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        setFormStatus('success');
                        setFormData({ name: '', email: '', message: '' });
                        // Remove a mensagem de sucesso após 8 segundos
                        setTimeout(() => setFormStatus(null), 8000);
                    } else {
                        const data = await response.json();
                        console.error('Erro Formspree:', data);
                        setFormStatus('error');
                    }
                } catch (error) {
                    console.error('Erro na requisição:', error);
                    setFormStatus('error');
                }
            };

                            <div className="grid md:grid-cols-2 gap-0 bg-slate-900 dark:bg-slate-800 rounded-[4rem] overflow-hidden shadow-2xl relative border border-white/5">
                                <div className="absolute -top-10 -right-10 w-80 h-80 bg-blue-600/20 blur-[100px] pointer-events-none"></div>
                                
                                <div className="p-16 md:p-24 text-white flex flex-col justify-center bg-blue-600">
                                    <h2 className="text-5xl md:text-6xl font-black mb-8 tracking-tighter leading-none">Vamos analisar <br />o futuro?</h2>
                                    <div className="flex items-center gap-2 text-blue-100 mb-12 font-bold opacity-80">
                                        <Icon name="MapPin" size={18} />
                                        {PROFILE_DATA.location}
                                    </div>
                                    
                                    <div className="space-y-8">
                                        <div className="flex items-center gap-5 group">
                                            <div className="p-4 bg-white/10 rounded-2xl text-white group-hover:bg-white group-hover:text-blue-600 transition-all"><Icon name="Mail" size={28} /></div>
                                            <a href={`mailto:${PROFILE_DATA.email}`} className="text-xl font-bold hover:underline break-all">{PROFILE_DATA.email}</a>
                                        </div>
                                        <div className="flex gap-5 pt-6">
                                            <a href={PROFILE_DATA.socials.github} target="_blank" rel="noopener noreferrer" className="p-5 bg-white/10 hover:bg-white hover:text-blue-600 rounded-3xl transition-all shadow-lg text-white"><Icon name="Github" size={28} /></a>
                                            <a href={PROFILE_DATA.socials.linkedin} target="_blank" rel="noopener noreferrer" className="p-5 bg-white/10 hover:bg-white hover:text-blue-600 rounded-3xl transition-all shadow-lg text-white"><Icon name="Linkedin" size={28} /></a>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-16 md:p-24 bg-slate-900/50 backdrop-blur-md">
                                    <form onSubmit={handleSubmit} className="space-y-6">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 ml-2">Nome Completo</label>
                                            <div className="relative">
                                                <div className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="User" size={20} /></div>
                                                <input 
                                                    required 
                                                    type="text" 
                                                    name="name"
                                                    value={formData.name} 
                                                    onChange={(e) => setFormData({...formData, name: e.target.value})} 
                                                    placeholder="Escreva o seu nome" 
                                                    className="w-full pl-14 pr-6 py-5 bg-slate-800 border border-slate-700 rounded-2xl focus:outline-none focus:border-blue-500 transition-all text-white placeholder:text-slate-600 font-bold" 
                                                />
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 ml-2">E-mail para contacto</label>
                                            <div className="relative">
                                                <div className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="Mail" size={20} /></div>
                                                <input 
                                                    required 
                                                    type="email" 
                                                    name="email"
                                                    value={formData.email} 
                                                    onChange={(e) => setFormData({...formData, email: e.target.value})} 
                                                    placeholder="exemplo@email.com" 
                                                    className="w-full pl-14 pr-6 py-5 bg-slate-800 border border-slate-700 rounded-2xl focus:outline-none focus:border-blue-500 transition-all text-white placeholder:text-slate-600 font-bold" 
                                                />
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 ml-2">Assunto / Mensagem</label>
                                            <textarea 
                                                required 
                                                rows="4" 
                                                name="message"
                                                value={formData.message} 
                                                onChange={(e) => setFormData({...formData, message: e.target.value})} 
                                                placeholder="Em que posso ajudar?" 
                                                className="w-full p-6 bg-slate-800 border border-slate-700 rounded-2xl focus:outline-none focus:border-blue-500 transition-all text-white placeholder:text-slate-600 resize-none font-bold"
                                            ></textarea>
                                        </div>
                                        <button 
                                            disabled={formStatus === 'sending'} 
                                            type="submit" 
                                            className="w-full py-6 bg-blue-600 hover:bg-blue-700 text-white rounded-3xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-4 transition-all active:scale-[0.98] shadow-2xl shadow-blue-600/40 disabled:bg-slate-700"
                                        >
                                            {formStatus === 'sending' ? "A PROCESSAR..." : formStatus === 'success' ? "MENSAGEM ENVIADA!" : formStatus === 'error' ? "ERRO AO ENVIAR!" : <span className="flex items-center gap-3">ENVIAR MENSAGEM <Icon name="Send" size={20} /></span>}
                                        </button>
                                        
                                        {formStatus === 'success' && <p className="text-emerald-400 text-xs text-center font-bold">Obrigado! Receberei o seu e-mail em breve.</p>}
                                        {formStatus === 'error' && <p className="text-red-400 text-xs text-center font-bold">Algo deu errado. Verifique se o ID do Formspree está correto ou se confirmou o formulário no seu e-mail.</p>}
                                    </form>
                                </div>
                            </div>
                        </div>
                    </section>

                    <footer className="py-16 border-t border-slate-200 dark:border-slate-800 px-6 text-center text-slate-400 font-black tracking-[0.3em] text-[10px] uppercase">
                        © {new Date().getFullYear()} Leandro Rocha • DATA & ANALYTICS PORTFOLIO
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
